name: CFT Security Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  security-gate:
    name: AI Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SberLab
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout CFT Security Agent
        uses: actions/checkout@v4
        with:
          repository: Ultramind-AI/cft-security-agent
          path: agent
          token: ${{ secrets.CFT_AGENT_REPO_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install agent + Semgrep
        working-directory: agent
        run: python -m pip install -e ".[sast]"

      - name: Prepare application scan target
        shell: bash
        run: |
          rm -rf scan-target
          mkdir -p scan-target
          cp -R target/backend scan-target/backend
          cp -R target/frontend scan-target/frontend

      - name: Run AI security pipeline
        id: security
        working-directory: agent
        env:
          CFT_AGENT_MODE: llm
          CFT_LLM_TRACE: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e

          python -m app.pipeline_run \
            --target ../scan-target \
            --architecture targets/sberlab_architecture.yaml \
            --output-dir artifacts/security-pipeline \
            --max-iterations 1

          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build GitHub Security Summary
        if: always()
        working-directory: agent
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          gate_path = Path("artifacts/security-pipeline/gate.json")

          if not gate_path.exists():
              summary = """# 🤖 CFT AI Security Gate

          ## ❌ PIPELINE ERROR

          `gate.json` was not produced.
          """
          else:
              gate = json.loads(gate_path.read_text())

              decision = gate["decision"].upper()
              icon = {
                  "PASS": "✅",
                  "WARN": "⚠️",
                  "FAIL": "❌",
              }.get(decision, "❓")

              lines = [
                  "# 🤖 CFT AI Security Gate",
                  "",
                  f"## {icon} {decision}",
                  "",
                  "| Metric | Result |",
                  "|---|---:|",
                  f"| Reports | {gate['reports_total']} |",
                  f"| Confirmed | {gate['confirmed']} |",
                  f"| Rejected | {gate['rejected']} |",
                  f"| Inconclusive | {gate['inconclusive']} |",
                  f"| Policy blocked | {gate['policy_blocked']} |",
                  "",
                  "## Findings",
                  "",
                  "| Gate | Status | Context | Finding |",
                  "|---|---|---|---|",
              ]

              for item in gate["findings"]:
                  effect = item["gate_effect"].upper()
                  effect_icon = {
                      "PASS": "✅",
                      "WARN": "⚠️",
                      "FAIL": "❌",
                  }.get(effect, "❓")

                  lines.append(
                      f"| {effect_icon} {effect} "
                      f"| {item['status']} "
                      f"| {item.get('context_priority') or 'N/A'} "
                      f"| `{item['finding_id']}` |"
                  )

              if gate.get("reasons"):
                  lines += ["", "## Decision basis", ""]
                  lines += [f"- {reason}" for reason in gate["reasons"]]

              summary = "\n".join(lines) + "\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          PY

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cft-security-results
          path: agent/artifacts/security-pipeline
          if-no-files-found: warn

      - name: Generate AI explanation for PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        working-directory: agent
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYCODE'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          gate_path = Path("artifacts/security-pipeline/gate.json")
          out = Path("artifacts/security-pipeline/pr-comment.md")

          marker = "<!-- cft-security-agent-comment -->"

          if not gate_path.exists():
              out.write_text(
                  marker + "\n"
                  "## 🤖 CFT Security Agent\n\n"
                  "Не удалось сформировать итоговый `gate.json`. "
                  "Проверьте логи GitHub Actions.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          gate = json.loads(gate_path.read_text(encoding="utf-8"))
          findings = gate.get("findings", [])

          blockers = [
              f for f in findings
              if f.get("gate_effect") == "fail"
          ]
          warnings = [
              f for f in findings
              if f.get("gate_effect") == "warn"
          ]

          safe_findings = [
              {
                  "finding_id": f.get("finding_id"),
                  "status": f.get("status"),
                  "gate_effect": f.get("gate_effect"),
                  "context_priority": f.get("context_priority"),
                  "reason": f.get("reason"),
              }
              for f in findings
          ]

          fallback = (
              f"Security Gate завершил проверку с решением "
              f"**{str(gate.get('decision', 'unknown')).upper()}**. "
              f"Подтверждено {gate.get('confirmed', 0)} из "
              f"{gate.get('reports_total', 0)} проверенных находок. "
          )

          if blockers:
              fallback += (
                  f"Merge заблокирован: обнаружено {len(blockers)} "
                  "подтверждённых блокирующих находок с высоким "
                  "контекстным приоритетом. Исправьте их и повторно "
                  "запустите Security Gate."
              )
          else:
              fallback += (
                  "По текущей политике блокирующих HIGH/CRITICAL "
                  "находок нет."
              )

          system_prompt = """Ты объясняешь разработчику результат CI/CD Security Gate.
          Пиши на русском языке, просто и понятно.

          Используй ТОЛЬКО переданные данные.
          Не меняй решение PASS/WARN/FAIL.
          Не придумывай Evidence.
          Не описывай способы эксплуатации уязвимостей и не создавай payload.
          Не показывай секреты, токены или значения паролей.

          Дай 3-5 коротких предложений:
          1. почему PR заблокирован или разрешён;
          2. какие классы проблем наиболее важны;
          3. что разработчику сделать дальше.

          LLM только объясняет решение. Само решение уже принято policy gate."""

          user_prompt = json.dumps(
              {
                  "decision": gate.get("decision"),
                  "reports_total": gate.get("reports_total"),
                  "confirmed": gate.get("confirmed"),
                  "rejected": gate.get("rejected"),
                  "inconclusive": gate.get("inconclusive"),
                  "blocking_findings": len(blockers),
                  "warning_findings": len(warnings),
                  "findings": safe_findings,
              },
              ensure_ascii=False,
          )

          routes = [
              (
                  "Groq",
                  "https://api.groq.com/openai/v1/chat/completions",
                  os.environ.get("GROQ_API_KEY", ""),
                  "openai/gpt-oss-120b",
              ),
              (
                  "OpenRouter",
                  "https://openrouter.ai/api/v1/chat/completions",
                  os.environ.get("OPENROUTER_API_KEY", ""),
                  "nvidia/nemotron-3-super-120b-a12b:free",
              ),
          ]

          explanation = None
          provider = "deterministic fallback"

          for name, url, key, model in routes:
              if not key:
                  continue

              payload = json.dumps({
                  "model": model,
                  "temperature": 0.2,
                  "max_tokens": 350,
                  "messages": [
                      {"role": "system", "content": system_prompt},
                      {"role": "user", "content": user_prompt},
                  ],
              }).encode()

              request = urllib.request.Request(
                  url,
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                      "User-Agent": "cft-security-agent",
                  },
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as r:
                      data = json.loads(r.read().decode())

                  candidate = data["choices"][0]["message"]["content"].strip()
                  if candidate:
                      explanation = candidate
                      provider = name
                      break

              except Exception as exc:
                  print(
                      f"[pr-explanation] {name} unavailable: "
                      f"{type(exc).__name__}"
                  )

          if not explanation:
              explanation = fallback

          decision = str(gate.get("decision", "unknown")).upper()
          decision_icon = {
              "PASS": "✅",
              "WARN": "⚠️",
              "FAIL": "❌",
          }.get(decision, "❓")

          lines = [
              marker,
              "## 🤖 CFT Security Agent",
              "",
              "### Что произошло",
              "",
              explanation,
              "",
              "### Результат",
              "",
              f"- **Решение:** {decision_icon} `{decision}`",
              f"- **Проверено:** {gate.get('reports_total', 0)}",
              f"- **Подтверждено:** {gate.get('confirmed', 0)}",
              f"- **Блокирующих находок:** {len(blockers)}",
              f"- **Предупреждений:** {len(warnings)}",
              "",
              "| Gate | Статус | Приоритет | Finding |",
              "|---|---|---|---|",
          ]

          for f in findings:
              effect = str(f.get("gate_effect", "unknown")).upper()
              icon = {
                  "FAIL": "❌",
                  "WARN": "⚠️",
                  "PASS": "✅",
              }.get(effect, "❓")

              lines.append(
                  f"| {icon} {effect} | "
                  f"{f.get('status', 'unknown')} | "
                  f"{f.get('context_priority') or 'N/A'} | "
                  f"`{f.get('finding_id', '')}` |"
              )

          lines += [
              "",
              "### Что делать дальше",
              "",
              "Исправьте блокирующие HIGH/CRITICAL находки и повторно "
              "запустите Security Gate.",
              "",
              f"Полный FinalReport и Evidence: artifact "
              f"`cft-security-results` в [GitHub Actions run]"
              f"({os.environ['RUN_URL']}).",
              "",
              f"_Пояснение сформировано через {provider}. "
              "Решение `PASS/WARN/FAIL` принимает детерминированный "
              "policy gate; LLM только объясняет уже принятое решение._",
          ]

          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"[pr-explanation] prepared via {provider}")
          PYCODE

      - name: Publish Security Agent comment
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        working-directory: agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- cft-security-agent-comment -->'
          body_file='artifacts/security-pipeline/pr-comment.md'

          if [ ! -f "$body_file" ]; then
            echo "No PR comment generated"
            exit 0
          fi

          existing_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
              | head -n 1
          )"

          if [ -n "$existing_id" ]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" \
              -f body="$(cat "$body_file")"
            echo "Updated existing CFT Security Agent comment"
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$(cat "$body_file")"
            echo "Created CFT Security Agent comment"
          fi

      - name: Enforce CI/CD Gate
        if: always()
        shell: bash
        run: |
          code="${{ steps.security.outputs.exit_code }}"

          if [ -z "$code" ]; then
            echo "::error::Security pipeline did not return a gate result."
            exit 2
          fi

          exit "$code"
